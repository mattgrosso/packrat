[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packrat"
version = "0.1.0"
description = "Workshop Voice Assistant"
authors = [{name = "Your Name", email = "your.email@example.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai",
    "pyaudio", 
    "numpy",
    "whisper",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.black]
target-version = ['py38']

[tool.flake8]
extend-ignore = ["F541", "E501"]

